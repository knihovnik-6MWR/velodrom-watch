# The Reservanto watcher's clock: every quarter of an hour it asks the app
# to read the velodrome's calendar, announce Mondays and book open lessons
# (lib/velodrom/watch.ts, app/api/velodrom/robot/watch).
#
# It runs from the public repo knihovnik-6MWR/velodrom-watch as
# .github/workflows/watch.yml (scheduled runs there cost nothing); this copy
# is the source. It is kept outside .github/ here so it does not run twice.
# The logs are public: nothing is printed but the app's status code.
#
# Needs the repository secret WATCH_SECRET (the app's VELODROM_WATCH_SECRET).
name: Velodrom – hlídač Reservanta

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: velodrom-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Reservanto
        env:
          WATCH_SECRET: ${{ secrets.WATCH_SECRET }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 -X POST \
            https://monkeysledger.xyz/api/velodrom/robot/watch \
            -H "Authorization: Bearer $WATCH_SECRET")
          echo "App answered $status"
          test "$status" = 200

      # GitHub turns off schedules in a public repo after 60 days without
      # activity; switching the workflow on again (once a day) resets that.
      - name: Keep the schedule alive
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "06" ] && [ "$(date -u +%M)" -lt 15 ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/watch.yml/enable"
          fi
